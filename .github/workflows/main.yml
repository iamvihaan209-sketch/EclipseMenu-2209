name: Build macOS Intel Geode Mod

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build:
    name: Build for macOS Intel
    runs-on: macos-13
    env:
      PATH: ${{ github.workspace }}/.local/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Geode CLI
        run: |
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/geode-sdk/cli/main/install.sh)"

      - name: Build Mod Package
        run: |
          # Verify the CLI location and build
          ~/.local/bin/geode build --platform MacOS --config RelWithDebInfo

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: eclipse-menu-macos-intel
          path: build/*.geode
