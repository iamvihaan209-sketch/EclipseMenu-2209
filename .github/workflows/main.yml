name: Build macOS Intel Geode Mod

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build:
    name: Build for macOS Intel
    runs-on: macos-15-intel

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Geode CLI via Homebrew
        run: |
          brew tap geode-sdk/geode
          brew install geode-cli

      - name: Build Mod Package
        run: |
          geode build --platform MacOS --config RelWithDebInfo

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: eclipse-menu-macos-intel
          path: build/*.geode
