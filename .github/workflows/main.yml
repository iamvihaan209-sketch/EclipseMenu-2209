name: Build macOS Intel Geode Mod

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build:
    name: Build for macOS Intel
    runs-on: macos-26-intel

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Geode CLI Directly
        run: |
          # Download the latest macOS release binary of Geode CLI directly from GitHub
          curl -L https://github.com/geode-sdk/cli/releases/latest/download/geode-macos -o geode
          chmod +x geode
          sudo mv geode /usr/local/bin/geode

      - name: Build Mod Package
        run: |
          geode build --platform MacOS --config RelWithDebInfo

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: eclipse-menu-macos-intel
          path: build/*.geode
