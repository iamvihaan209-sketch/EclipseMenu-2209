name: Build macOS Intel Geode Mod

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build:
    name: Build for macOS Intel
    runs-on: macos-13

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Geode CLI
        run: |
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/geode-sdk/cli/main/install.sh)"
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Build Mod Package
        run: |
          # Add .local/bin to PATH for this step just in case
          export PATH="$HOME/.local/bin:$PATH"
          geode build --platform MacOS --config RelWithDebInfo

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: eclipse-menu-macos-intel
          path: build/*.geode
